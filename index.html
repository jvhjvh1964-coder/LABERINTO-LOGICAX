<head>

<style>
:root{--fondo:#101722;--panel:#1c2635;--amarillo:#ffe600;--azul:#008cff}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}

#juego{
display:grid;
grid-template-columns:1fr 1fr;
height:calc(100vh - 32px);
min-height:0}

#zonaPista{position:relative;min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;background:#000;border-right:3px solid white}

#tituloPista{
    z-index:3;
    padding:7px 5px;
    text-align:center;
    font-size:clamp(15px,1.5vw,23px);
    font-weight:900;
    letter-spacing:2px;
    background:#000;
    border-bottom:3px solid var(--amarillo);
    text-shadow:0 0 12px #00aaff;
}

#pistaSVG{width:100%;height:auto;flex:1;min-height:0;display:block}
.pistaBorde{fill:none;stroke:white;stroke-width:72;stroke-linecap:round;stroke-linejoin:round}
.pistaBase{fill:none;stroke:#17202b;stroke-width:62;stroke-linecap:round;stroke-linejoin:round}
.pistaSegmento{fill:none;stroke-width:50;stroke-linecap:butt;stroke-linejoin:round}
#tortuga{font-size:58px;text-anchor:middle;dominant-baseline:central;filter:drop-shadow(0 0 5px white) drop-shadow(0 0 12px #7cfc00)}
.etiquetaPista{font-size:17px;font-weight:900;text-anchor:middle;fill:white;paint-order:stroke;stroke:#111923;stroke-width:4px}
#progresoTexto{position:absolute;left:12px;bottom:12px;padding:9px 14px;background:#101722dd;border:2px solid #6f859d;border-radius:8px;font-size:15px;font-weight:bold}

#panelDerecho{
    min-width:0;
    min-height:0;
    padding:8px;
    display:grid;
    grid-template-rows:minmax(90px,18%) minmax(0,1fr);
    gap:8px;
    background:#111925
}

#zonaRuleta,#zonaPreguntas{min-height:0;min-width:0;background:var(--panel);border:2px solid #536579;border-radius:12px;padding:8px;overflow:hidden}
#zonaRuleta{display:flex;align-items:center;justify-content:space-around;gap:8px;position:relative}

#contenedorRuleta{
    width:min(42%,170px);
    max-height:75%;
    aspect-ratio:1;
    position:relative;
    flex-shrink:0
}

#ruleta{position:absolute;inset:0;border-radius:50%;border:5px solid white;box-shadow:0 0 14px #000,inset 0 0 12px #000;background:conic-gradient(#e53935 0deg 72deg,#147bd1 72deg 144deg,#18a558 144deg 216deg,#f2c500 216deg 288deg,#7938b8 288deg 360deg);transition:transform 4s cubic-bezier(.12,.65,.12,1)}

#puntero{position:absolute;z-index:3;left:50%;top:-12px;transform:translateX(-50%);width:0;height:0;border-left:17px solid transparent;border-right:17px solid transparent;border-top:38px solid black;filter:drop-shadow(3px 4px 3px #777)}
#centroRuleta{position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);width:42%;aspect-ratio:1;display:flex;justify-content:center;align-items:center;text-align:center;border-radius:50%;border:4px solid white;background:#111925;box-shadow:0 0 12px black,0 0 22px #ffe600,inset 0 0 12px #ffe600;color:#ffe600;font-size:clamp(24px,3vw,46px);font-weight:900;text-shadow:0 0 12px #ffe600}
button:disabled{opacity:.45;cursor:not-allowed!important}
#botonGirar{padding:9px 14px;border:2px solid white;border-radius:9px;background:#d71932;color:white;font-size:clamp(13px,1.2vw,21px);font-weight:900;cursor:pointer;box-shadow:0 0 10px #f33;flex-shrink:0}
#zonaPreguntas{display:flex;flex-direction:column;gap:7px}
#tituloPreguntas{text-align:center;font-size:clamp(15px,1.4vw,21px);font-weight:900;letter-spacing:1px;margin:2px 0}

#estadisticas{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    width:100%;
}

.estadistica{
    background:#0c1420;
    border:2px solid #66798c;
    border-radius:8px;
    padding:10px;
    text-align:center;
    font-size:clamp(15px,1.5vw,22px);
    font-weight:900;
}

#temporizador{color:#ffe600;font-size:20px}
#botonInicio{background:#087d45;color:white;border:2px solid white;border-radius:7px;padding:10px;font-weight:900;font-size:17px;cursor:pointer}
#recuadroPregunta{background:#f6f8fc;color:#111827;border:3px solid white;border-radius:12px;padding:12px;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:8px}
#numeroPregunta{color:#4b5563;text-align:center;font-size:12px;font-weight:bold}

#pregunta{
    font-size:clamp(42px,4.2vw,60px);
    font-weight:900;
    text-align:center;
    overflow-wrap:anywhere;
    line-height:1.4;
    letter-spacing:2px;
}

#alternativas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;width:100%}

.alternativa {
    min-width: 0;
    min-height: 75px;
    padding: 10px 5px;
    border: 3px solid white;
    border-radius: 12px;
    color: white;
    font-size: clamp(38px, 4vw, 58px);
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 4px 0 #0004;
    overflow-wrap: anywhere;
    transition: transform .12s;
    display: flex;
    align-items: center;
    justify-content: center;
}

.alternativa:hover:not(:disabled) {
    transform: scale(1.06);
    filter: brightness(1.2);
}

#autor{height:32px;display:flex;align-items:center;justify-content:center;text-align:center;background:#05090e;border-top:1px solid white;color:silver;font-size:clamp(10px,1vw,14px);letter-spacing:.4px}
#efectoError,#efectoCorrecto{display:none;position:fixed;z-index:60;inset:0;align-items:center;justify-content:center;pointer-events:none;background:#0002}
#efectoError span{color:#ff001e;font-size:min(40vw,260px);font-weight:900;text-shadow:0 0 8px white,0 0 22px red;animation:golpe .3s ease-out}
#efectoCorrecto span{color:#008cff;font-size:min(40vw,260px);font-weight:900;text-shadow:0 0 8px white,0 0 22px #008cff;animation:golpe .3s ease-out}
@keyframes golpe{0%{transform:scale(.2) rotate(-30deg)}65%{transform:scale(1.2) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
#modalFinal{display:none;position:fixed;z-index:100;inset:0;align-items:center;justify-content:center;padding:15px;background:#000d}
#contenidoFinal{width:min(750px,95vw);background:white;color:black;border:7px solid #e00020;border-radius:18px;padding:25px 20px;text-align:center;box-shadow:0 0 35px #ff203f}
#contenidoFinal h2{color:#c9001e;font-size:clamp(25px,5vw,46px);margin:0 0 14px}
#notaFinal{font-size:clamp(58px,11vw,100px);line-height:1.1;font-weight:900;color:#101722;margin:12px 0}
#detalleFinal{font-size:clamp(16px,3vw,24px);line-height:1.5;font-weight:bold}
#cerrarFinal{margin-top:16px;padding:10px 22px;background:#c9001e;color:white;border:2px solid black;border-radius:8px;font-size:17px;font-weight:900;cursor:pointer}
#escanerAzul{position:fixed;top:0;left:0;width:100vw;height:18px;z-index:999;pointer-events:none;opacity:0;background:linear-gradient(90deg,transparent 0%,#008cff 20%,#fff 50%,#008cff 80%,transparent 100%);box-shadow:0 0 6px #008cff,0 0 14px #008cff,0 0 28px #00bfff,0 0 42px #06f;animation:barridoEscaner 2s linear infinite}
@keyframes barridoEscaner{0%{top:0;opacity:0}2%{opacity:1}27%{top:calc(100vh - 18px);opacity:1}29%{opacity:0}50%{top:calc(100vh - 18px);opacity:0}52%{opacity:1}77%{top:0;opacity:1}79%{opacity:0}100%{top:0;opacity:0}}

#estadisticas{

.estadistica{

#puntero{border-left-width:11px;border-right-width:11px;border-top-width:27px;top:-10px}#botonGirar{padding:6px 8px;font-size:12px}#tituloPreguntas{letter-spacing:0;font-size:12px}

#pregunta{
    font-size:clamp(24px,6vw,38px);

/* Alternativas en celulares */
#alternativas {

  grid-template-columns: 1fr;

/* Efecto de muchas burbujas azules y amarillas */
#capaBurbujas {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  z-index: 55;
  overflow: hidden;
  pointer-events: none;
}

.burbuja {
  position: absolute;
  bottom: -50px;
  border-radius: 50%;
  animation: subirBurbuja 2s ease-out forwards;
  pointer-events: none;
}

.burbuja.azul {
  border: 2px solid rgba(80, 190, 255, 0.75);
  background: rgba(0, 140, 255, 0.20);
  box-shadow: inset 0 0 8px #9cddff,
              0 0 10px rgba(0, 140, 255, 0.55);
}

.burbuja.amarilla {
  border: 2px solid rgba(255, 230, 0, 0.80);
  background: rgba(255, 230, 0, 0.18);
  box-shadow: inset 0 0 8px #fff5a0,
              0 0 10px rgba(255, 230, 0, 0.50);
}

@keyframes subirBurbuja {
  0% {
    transform: translate(0, 0) scale(0.4);
    opacity: 0;
  }

  15% {
    opacity: 0.85;
  }

  100% {
    transform: translate(var(--desplazamiento), -115vh) scale(1.3);
    opacity: 0;
  }
}

#modalEstudiante {
  position: fixed;
  inset: 0;
  z-index: 2000;
  display: flex;
  align-items: center;
  justify-content: center;

}

#cuadroEstudiante {

  display: flex;
  flex-direction: column;

}

#cuadroEstudiante label {
  font-size: clamp(23px, 4vw, 34px);

}

#nombreEstudiante {
  width: 100%;

#aceptarNombre {

@keyframes zoomGiroNombre {

#nombreFinal {
  margin: 8px 0 14px;
  color: #111;
  font-size: clamp(22px, 4vw, 32px);
  font-weight: 900;
  overflow-wrap: anywhere;
}



</style>

<script>
"use strict";

const TOTAL=30,DURACION=120;
const $=id=>document.getElementById(id);
const coloresAlternativas=["#c62828","#1266bd","#168449","#7436ad","#bd6500","#263746"];

let preguntas=[],indice=0,correctas=0,erradas=0,tiempo=DURACION,intervalo=null,iniciado=false,terminado=false,bloqueado=false,anguloRuleta=0,intervaloRuleta=null,longitudCamino=0,recorrido=0;

let nombreEstudiante = "";


// ================================================
// FUNCIONES AUXILIARES ALEATORIAS
// ================================================

// Generar números enteros aleatorios
function entero(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

// Mezclar elementos de una lista aleatoriamente
function mezclar(a) {
    for (let i = a.length - 1; i > 0; i--) {
        let j = entero(0, i);
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}


// ================================================
// BANCO DE SERIES LÓGICAS VISUALES
// ================================================

// Colecciones de símbolos
const seriesVisuales = [
    ["😍", "🙉", "🚚"],
    ["🐶", "🐱", "🐸"],
    ["🚗", "🚕", "🚌"],
    ["🍎", "🍌", "🍇"],
    ["⚽", "🏀", "🏈"],
    ["🌞", "🌙", "⭐"],
    ["🔴", "🔵", "🟢"],
    ["🟡", "🟣", "🟠"],
    ["⬛", "⬜", "🟥"],
    ["🔺", "🔵", "🟩"],
    ["🟥", "🟦", "🟨"],
    ["🟪", "🟧", "🟫"],
    ["🔶", "🔷", "🔺"],
    ["◼️", "◻️", "🔴"],
    ["⭐", "💎", "❤️"],
    ["🚀", "✈️", "🚁"],
    ["🐢", "🦋", "🐝"],
    ["🎈", "🎁", "🎀"],
    ["🌈", "☀️", "☁️"],
    ["🍓", "🍊", "🍉"],
    ["🟦", "🔺", "😍"],
    ["🐶", "🔴", "🚗"],
    ["⭐", "🟩", "🙉"],
    ["🚚", "🔵", "🍎"]
];


// ================================================
// BANCO DE DISTRACTORES SIMILARES
// ================================================

const gruposSimilares = [

    // Caritas y expresiones
    ["😍", "🥰", "😎", "🙉"],

    // Animales
    ["🐶", "🐱", "🐸", "🐢", "🦋", "🐝", "🐞", "🦗"],

    // Vehículos
    ["🚗", "🚕", "🚌", "🚚"],

    // Transporte aéreo
    ["🚀", "✈️", "🚁"],

    // Frutas
    ["🍎", "🍌", "🍇", "🍓", "🍊", "🍉"],

    // Deportes
    ["⚽", "🏀", "🏈"],

    // Sol, luna y estrellas
    ["🌞", "☀️", "🌙", "⭐", "🌟", "✨"],

    // Círculos de colores
    ["🔴", "🔵", "🟢", "🟡", "🟣", "🟠"],

    // Bloques cuadrados
    ["⬛", "⬜", "🟥", "🟦", "🟨", "🟪", "🟧", "🟫"],

    // Triángulos
    ["🔺", "🔻", "🔼"],

    // Diamantes
    ["🔶", "🔷", "💠"],

    // Símbolos decorativos
    ["⭐", "💎", "❤️", "💛", "💙"],

    // Globos y regalos
    ["🎈", "🎁", "🎀"],

    // Naturaleza y clima
    ["🌈", "☀️", "☁️"]
];

// Obtener dos distractores de la misma familia
function obtenerDistractores(correcta) {

    const grupo = gruposSimilares.find(
        g => g.includes(correcta)
    );

    if (!grupo) {
        return mezclar(
            [...new Set(seriesVisuales.flat())]
                .filter(x => x !== correcta)
        ).slice(0, 2);
    }

    return mezclar(
        grupo.filter(x => x !== correcta)
    ).slice(0, 2);
}


// ================================================
// GENERAR PREGUNTAS
// ================================================

function generarPreguntaSerie(modalidad) {

    const base = [...seriesVisuales[
        entero(0, seriesVisuales.length - 1)
    ]];

    const patron = base.slice(0, 3);

    let texto = "";
    let correcta = "";

    if (modalidad === 0) {

        // MODALIDAD 1: ¿QUÉ SIGUE?
        const secuencia = [];

        for (let i = 0; i < 4; i++) {
            secuencia.push(patron[i % 3]);
        }

        correcta = patron[4 % 3];
        texto = secuencia.join("  ") + "  ❓";

    } else if (modalidad === 1) {

        // MODALIDAD 2: ¿QUÉ INICIA?
        const secuencia = [];

        for (let i = 1; i <= 4; i++) {
            secuencia.push(patron[i % 3]);
        }

        correcta = patron[0];
        texto = "❓  " + secuencia.join("  ");

    } else {

        // MODALIDADES 3 Y 4
        const secuencia = [];

        for (let i = 0; i < 6; i++) {
            secuencia.push(patron[i % 3]);
        }

        const posicionFaltante = modalidad === 2 ? 2 : 3;

        correcta = secuencia[posicionFaltante];

        secuencia[posicionFaltante] = "❓";

        texto = secuencia.join("  ");
    }

    const distractores = obtenerDistractores(correcta);

    const opciones = mezclar([
        correcta,
        ...distractores
    ]);

      return {
        texto: texto,
        correcta: correcta,
        opciones: opciones,
        tipo: "serie",
        modalidad: modalidad,
        posicionFaltante: modalidad === 0 ? 4 :
                          modalidad === 1 ? 0 :
                          modalidad === 2 ? 2 : 3
     };

}

// =======================================================
// GENERAR SERIES NUMÉRICAS ASCENDENTES Y DESCENDENTES
// =======================================================

function generarPreguntaNumerica(longitud, paso) {

    // Generar un número inicial según el sentido de la serie
    const inicio = paso > 0
        ? entero(1, 20)
        : entero(30, 60);

    // Construir la secuencia matemática
    const secuencia = [];

    for (let i = 0; i < longitud; i++) {
        secuencia.push(inicio + (i * paso));
    }

    // Elegir aleatoriamente la posición faltante
    const posicionFaltante = entero(0, longitud - 1);

    // Guardar la respuesta correcta
    const correcta = secuencia[posicionFaltante];

    // Reemplazar el número por el signo de interrogación
    secuencia[posicionFaltante] = "❓";

    // Generar dos alternativas numéricas incorrectas
    const distractores = mezclar(
        [-5, -2, -1, 1, 2, 5]
            .map(d => correcta + d)
            .filter(n => n > 0)
    ).slice(0, 2);

    // Mezclar las tres alternativas
    const opciones = mezclar([
        correcta,
        ...distractores
    ]);

    return {
        texto: secuencia.join("  "),
        correcta: correcta,
        opciones: opciones,
        tipo: "serie",
        modalidad: "numerica",
        posicionFaltante: posicionFaltante
    };
}

// ================================================
// GENERAR 30 PREGUNTAS ALEATORIAS
// ================================================

function generarTodasLasPreguntas() {

    const salida = [];

    // ==========================================
    // 24 PREGUNTAS DE SERIES VISUALES
    // ==========================================

    const modalidades = [
        ...Array(6).fill(0),
        ...Array(6).fill(1),
        ...Array(6).fill(2),
        ...Array(6).fill(3)
    ];

    mezclar(modalidades);

    modalidades.forEach(modalidad => {
        salida.push(generarPreguntaSerie(modalidad));
    });


    // ==========================================
    // 6 PREGUNTAS DE SERIES NUMÉRICAS
    // ==========================================

    const patronesNumericos = [

        // SERIES DE 5 NÚMEROS

        { longitud: 5, paso: 3 },  // Ascendente +3
        { longitud: 5, paso: -3 }, // Descendente -3
        { longitud: 5, paso: 2 },  // Ascendente +2

        // SERIES DE 6 NÚMEROS

        { longitud: 6, paso: 4 },  // Ascendente +4
        { longitud: 6, paso: -4 }, // Descendente -4
        { longitud: 6, paso: -2 }  // Descendente -2
    ];

    patronesNumericos.forEach(p => {

        salida.push(
            generarPreguntaNumerica(
                p.longitud,
                p.paso
            )
        );

    });

    // Mezclar las 30 preguntas
    return mezclar(salida);
}

function iniciarJuego(){
	if(iniciado||terminado)return;
	preguntas=generarTodasLasPreguntas();
	indice=0;correctas=0;erradas=0;tiempo=DURACION;iniciado=true;bloqueado=false;recorrido=0;

	$("botonGirar").disabled=false;
 	iniciarGiroAutomatico();
	actualizarEstadisticas();
	mostrarPregunta();
 	intervalo=setInterval(()=>{tiempo--;actualizarEstadisticas();if(tiempo<=0)finalizarJuego("¡Se acabó el tiempo!");},1000);
}

function mostrarPregunta(){
 	if(terminado)return;
	if(indice>=TOTAL){
		finalizarJuego("¡Respondiste 30 preguntas!");
		return}
 
 bloqueado=false;

 const q = preguntas[indice];

 $("pregunta").textContent = q.texto;

 const contenedorAlternativas = $("alternativas");
 contenedorAlternativas.innerHTML = "";

// En celulares, estos tres tipos conservan las
// alternativas en una misma fila.

const tiposEnUnaFila = ["serie"];

contenedorAlternativas.classList.toggle(
  "excepcion",
  tiposEnUnaFila.includes(q.tipo)
);

 q.opciones.forEach(valor=>{
	const b=document.createElement("button");
	b.type="button";
	b.className="alternativa";
	b.textContent=valor;
	b.style.background=coloresAlternativas[entero(0,coloresAlternativas.length-1)];
	b.addEventListener("click",()=>responder(valor));
	$("alternativas").appendChild(b)});

}

function crearBurbujas() {
  const capa = $("capaBurbujas");

  // Limpiar las burbujas anteriores
  capa.innerHTML = "";

  // Crear 70 burbujas en toda la pantalla
  for (let i = 0; i < 70; i++) {
    const burbuja = document.createElement("div");

    burbuja.className = "burbuja";

    // Alternar aleatoriamente entre azul y amarillo
    burbuja.classList.add(
      Math.random() < 0.5 ? "azul" : "amarilla"
    );

    // Tamaños variados
    const tamano = entero(12, 38);

    burbuja.style.width = tamano + "px";
    burbuja.style.height = tamano + "px";

    // Distribución horizontal por todo el ancho
    burbuja.style.left = (Math.random() * 100) + "vw";

    // Movimiento lateral aleatorio
    burbuja.style.setProperty(
      "--desplazamiento",
      entero(-80, 80) + "px"
    );

    capa.appendChild(burbuja);

    // Eliminar cada burbuja al terminar los 2 segundos
    burbuja.addEventListener("animationend", () => {
      burbuja.remove();
    }, { once: true });
  }
}


function responder(valor){

      if(!iniciado||terminado||bloqueado)return;

          bloqueado=true;

        // Mostrar 70 burbujas azules y amarillas durante 2 segundos
         crearBurbujas();

         $("alternativas").querySelectorAll("button").forEach(b=>b.disabled=true);

	const preguntaActual = preguntas[indice];
	const ok = String(valor) === String(preguntaActual.correcta);

	if(ok){

	    correctas++;

	    // Reemplazar ❓ por el emoji correcto
	    const elementos = preguntaActual.texto.split("  ");
	    elementos[preguntaActual.posicionFaltante] =
	        preguntaActual.correcta;

	    $("pregunta").textContent = elementos.join("  ");
	    mostrarEfecto("efectoCorrecto");
	    avanzarTortuga();

	}else{

	    erradas++;
	    // Mantener el signo ❓ si la respuesta es incorrecta
	    mostrarEfecto("efectoError");
	}


indice++;
actualizarEstadisticas();

 setTimeout(()=>{if(!terminado)mostrarPregunta()},350);
}

function mostrarEfecto(id){
	const e=$(id);e.style.display="none";
	void e.offsetWidth;
	e.style.display="flex";
	setTimeout(()=>e.style.display="none",300)
}

function prepararCamino(){
	const c=$("camino");
	longitudCamino=c.getTotalLength();
	const p=c.getPointAtLength(0);
	$("tortuga").setAttribute("x",p.x);$("tortuga").setAttribute("y",p.y)
}

function avanzarTortuga(){
 const c=$("camino"),t=$("tortuga");longitudCamino=c.getTotalLength();recorrido=Math.min(recorrido+1,TOTAL);
 const d=(recorrido/TOTAL)*longitudCamino,p=c.getPointAtLength(d),prev=c.getPointAtLength(Math.max(0,d-2));
 const ang=Math.atan2(p.y-prev.y,p.x-prev.x)*180/Math.PI;t.setAttribute("x",p.x);t.setAttribute("y",p.y);t.setAttribute("transform",`rotate(${ang} ${p.x} ${p.y})`);
 $("progresoTexto").textContent=`🐢 AVANCE: ${Math.round(recorrido/TOTAL*100)}%`;
}

function actualizarEstadisticas(){

    $("correctas").textContent = correctas;

    $("temporizador").textContent = Math.max(0, tiempo);

    $("temporizador").style.color =
        tiempo <= 10 ? "#ff334d" : "#ffe600";

}

function calcularNota(){return 1+(correctas/TOTAL)*6}

function finalizarJuego(motivo){
  if (terminado) return;

  terminado = true;
  iniciado = false;
  bloqueado = true;

  clearInterval(intervalo);
  detenerGiroAutomatico();

  $("botonGirar").disabled = true;
  $("alternativas").innerHTML = "";
  $("pregunta").textContent = "¡Gracias por participar!";

  const nota = calcularNota();

  $("nombreFinal").textContent =
    "ESTUDIANTE: " + nombreEstudiante;

  $("detalleFinal").textContent = motivo;

  $("notaFinal").textContent =
    nota.toFixed(1).replace(".", ",");

  $("centroRuleta").textContent =
    nota.toFixed(1).replace(".", ",");

  $("modalFinal").style.display = "flex";
}
$("cerrarFinal").addEventListener("click",()=>$("modalFinal").style.display="none");


function girarRuleta(){
	anguloRuleta+=360*entero(4,7)+entero(0,359);
	$("ruleta").style.transform=`rotate(${anguloRuleta}deg)`
  }
$("botonGirar").addEventListener("click",()=>{if(iniciado&&!terminado)girarRuleta()});

function iniciarGiroAutomatico(){
	if(intervaloRuleta!==null)return;
	girarRuleta();
	intervaloRuleta=setInterval(()=>{if(iniciado&&!terminado)girarRuleta()},5000)
  }

function detenerGiroAutomatico(){
   if(intervaloRuleta!==null)
      {clearInterval(intervaloRuleta);
       intervaloRuleta=null}
   }

function formatearNombre(nombre){
  return nombre
    .trim()
    .replace(/\s+/g, " ")
    .toLocaleLowerCase("es")
    .replace(/(^|[\s'-])([a-záéíóúüñ])/g,
      (coincidencia, separador, letra) =>
        separador + letra.toLocaleUpperCase("es")
    );
}

function aceptarNombre(){
  const entrada = $("nombreEstudiante");
  const nombre = formatearNombre(entrada.value);

  if (!nombre){
    entrada.focus();
    entrada.placeholder = "Debes ingresar tu nombre";
    return;
    }

  nombreEstudiante = nombre;
  $("modalEstudiante").style.display = "none";

  // Comenzar el juego después de registrar el nombre
  iniciarJuego();
 }


$("aceptarNombre").addEventListener("click", aceptarNombre);

$("nombreEstudiante").addEventListener("keydown", e => {
  if (e.key === "Enter") aceptarNombre();
});

prepararCamino();
actualizarEstadisticas();


</script>
